<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- Required meta tags -->
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65"
      crossorigin="anonymous"
    />
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat&family=Orbitron&display=swap"
      rel="stylesheet"
    />
    <link href="/stylesheets/style.css" rel="stylesheet" />

    <!-- Shows in Google search results -->
    <meta
      name="description"
      content="A scientific study, with a web game demonstration, on multitasking."
    />

    <!-- Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="icon" type="image/x-icon" href="/images/favicon.ico" />
    <title>Visible Bottleneck</title>
  </head>

  <body>
    <header>
      <nav class="navbar navbar-expand-sm navbar-background navbar-dark">
        <div class="container-fluid">
          <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarSupportedContent"
            aria-controls="navbarSupportedContent"
            aria-expanded="false"
            aria-label="Toggle navigation"
          >
            <span class="navbar-toggler-icon"></span>
          </button>
          <div
            class="collapse navbar-collapse justify-content-center"
            id="navbarSupportedContent"
          >
            <ul class="navbar-nav mb-2 mb-lg-0">
              <li class="nav-item">
                <a class="nav-link active" aria-current="page" href="/">Home</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="/about">About</a>
              </li>
              <!-- <li class="nav-item">
                                <a class="nav-link" href="/comments">Leave a Comment</a>
                            </li> -->
              <li class="nav-item dropdown">
                <a
                  class="nav-link dropdown-toggle"
                  href="/game"
                  id="navbarDropdown"
                  role="button"
                  data-bs-toggle="dropdown"
                  aria-expanded="false"
                >
                  The Multitasking Test
                </a>
                <ul class="dropdown-menu" aria-labelledby="navbarDropdown">
                  <li>
                    <a class="dropdown-item" href="/instructions-"
                      >Instructions</a
                    >
                  </li>
                  <li>
                    <a class="dropdown-item" href="/game">Multitasking Test</a>
                  </li>
                </ul>
              </li>
            </ul>
          </div>
        </div>
      </nav>
    </header>

    <script>
      // To set active link.
      let url = window.location.href;
      // Select all the anchor tags
      let links = document.querySelectorAll("a");
      // Loop through the link lists
      links.forEach((link) => {
        // Remove .active on all links.
        link.classList.remove("active");
        var href = link.href;
        if (href == url) link.classList.add("active");
      });
    </script>

    <nav class="navbar navbar-expand-lg">
      <div class="container-fluid">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item">
            <a
              id="edit-button"
              class="btn btn-info"
              role="button"
              href="/instructions-1/edit"
              style="display: none"
              >Edit</a
            >
          </li>
        </ul>
        <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
          <li class="nav-item">
            <a class="btn btn-outline-success" role="button" href="/">Finish</a>
          </li>
        </ul>
      </div>
    </nav>
    <div class="container">
      <h1>Both Tasks</h1>
      <div id="instructions" bis_skin_checked="1">
        <p>
          Finally you are going to try the “Both Task”. Here you have
          <b>both the Left Task and the Right Task going at the same time</b>.
          Your job is to keep both bars as low as possible.
        </p>
      </div>
    </div>
  </body>
</html>
